[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avs"
version = "0.1.0"
description = "Aadhaar Verification Service — UIDAI Secure QR signature verification for M-One HRM"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Dheeraj Sharma" }]

# Step 0 installs only what the foundation needs. Each later step adds its own
# dependencies to the appropriate optional group below — keeping the base install
# small means a broken ML dependency can never block the crypto core.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# ── Step 1-2: cryptographic core ─────────────────────────────────────────────
crypto = [
    "cryptography>=42.0",
]

# ── Step 3: ingest (Pillow is core pipeline, not optional) ───────────────────
ingest = [
    "pillow>=10.3",
    "pillow-heif>=0.16",
    # PDF rendering. pypdfium2 wraps PDFium (the engine in Chrome) and ships
    # prebuilt wheels for Windows, macOS and Linux — no system package needed.
    #
    # ⚠ Chosen over PyMuPDF deliberately: PyMuPDF is AGPL, which would impose
    #   source-disclosure obligations on the HRM that embeds this service.
    #   pypdfium2 is Apache-2.0 / BSD-3.
    "pypdfium2>=4.30",
]

# ── Step 4-5: preprocessing and QR decoding ──────────────────────────────────
imaging = [
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "zxing-cpp>=2.2",
    "pyzbar>=0.1.9",
    "glymur>=0.12",
]

# ── Step 7-9: service layer ──────────────────────────────────────────────────
service = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # Required for multipart uploads. FastAPI raises at import time without it,
    # so the /v1/verify/upload route simply would not exist.
    "python-multipart>=0.0.9",
    "celery>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

# ── Step 12-19: AI vision layer ──────────────────────────────────────────────
ai = [
    "onnxruntime>=1.18",
]

# ── Step 17-18: OCR and name matching ────────────────────────────────────────
matching = [
    "rapidfuzz>=3.9",
    "indic-transliteration>=2.3",
]

dev = [
    # segno renders the synthetic Secure QR codes used by the benchmark and the
    # Step 5 tests. Test/benchmark only — never imported by anything under src/.
    "segno>=1.6",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
avs = "avs.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/avs"]

# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "corpus: requires the local Aadhaar image corpus (never committed)",
    "slow: long-running",
]

[tool.coverage.run]
source = ["src/avs"]
branch = true

# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
    "S101",   # assert is fine in tests
    "E501",   # line length handled by the formatter
    "UP042",  # `str, Enum` is deliberate — it keeps JSON serialisation and
              # pydantic behaviour identical across versions. Do not "modernise"
              # the frozen contract enums to StrEnum without a contract bump.
    "S105",   # false positive: CheckResult.PASS is a check result, not a password
    "UP017",  # `timezone.utc` over `datetime.UTC`: universally correct, and keeps
              # the security-critical modules free of gratuitous version coupling.
    "RUF002", # en-dashes and ranges in prose docstrings are intentional; this
    "RUF003", # codebase explains WHY in prose and readability wins over ASCII purity.
]

[tool.ruff.lint.per-file-ignores]
# typer's entire API is function calls in argument defaults.
"src/avs/cli.py" = ["B008"]
"tests/**" = ["S", "B"]

# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["avs"]

[[tool.mypy.overrides]]
module = ["cv2.*", "zxingcpp.*", "pyzbar.*", "glymur.*", "onnxruntime.*"]
ignore_missing_imports = true
